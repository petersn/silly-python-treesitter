[package]
name = "silly_python_treesitter"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24.0", features = ["extension-module"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tree-sitter = "0.25.3"
tree-sitter-systemverilog = { git = "https://github.com/petersn/tree-sitter-systemverilog" }

